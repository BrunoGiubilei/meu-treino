<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meu Treino</title>

  <!-- Suporte a PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#1d4ed8">

  <!-- Fontes e estilos -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Todas as telas (início, treino, edição) são desenhadas aqui pelo app.js -->
  <div id="app"></div>

  <!-- Barra de descanso: aparece só durante um treino -->
  <div id="rest-bar" hidden>
    <span id="rest-timer">Descanso</span>
    <button data-action="rest" data-value="60">60s</button>
    <button data-action="rest" data-value="90">90s</button>
    <button data-action="rest" data-value="120">120s</button>
    <button data-action="stop-timer" aria-label="Parar">✕</button>
  </div>

  <!-- Aviso rápido (ex.: "Backup copiado") -->
  <div id="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
